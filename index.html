<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI ブルーカラー求人マッチング</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- ヘッダー -->
  <header class="bg-blue-600 text-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">現場特化型 AI求人マッチング</h1>
      <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">企業・採用担当者向け</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <!-- 左側：求人票生成フォーム -->
    <section class="bg-white p-6 rounded-lg shadow-md h-fit">
      <h2 class="text-lg font-bold mb-4 border-b pb-2 text-blue-600">1. AI求人票作成</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">職種・仕事内容の概要</label>
          <input type="text" id="jobTitle" placeholder="例: 建築現場の施工管理、ドライバー" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">給与条件や特徴</label>
          <input type="text" id="jobCondition" placeholder="例: 月給30万以上、未経験歓迎、残業少なめ" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <button id="generateBtn" onclick="generateJobOffer()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded transition shadow">
          Geminiで求人票を生成する
        </button>
      </div>

      <!-- 生成結果エリア -->
      <div id="resultContainer" class="mt-6 hidden">
        <h3 class="text-md font-semibold mb-2 text-gray-700">生成された求人票プレビュー</h3>
        <div id="resultText" class="p-4 bg-gray-50 border rounded text-sm whitespace-pre-wrap leading-relaxed min-h-[150px]"></div>
        
        <!-- 掲載ボタン -->
        <button id="publishBtn" onclick="publishJob()" class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded transition shadow">
          📌 この求人を掲載する
        </button>
      </div>
    </section>

    <!-- 右側：掲載中の求人カード一覧 -->
    <section class="bg-white p-6 rounded-lg shadow-md">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-lg font-bold text-gray-800">2. 掲載中の求人一覧</h2>
        <span id="jobCount" class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full">0件</span>
      </div>

      <!-- 求人カードが並ぶエリア -->
      <div id="jobList" class="space-y-4 max-h-[600px] overflow-y-auto pr-1">
        <!-- カードが動的に追加されます -->
      </div>
    </section>

  </main>

  <script>
    let currentGeneratedText = "";

    // ページ読み込み時に保存された求人を表示
    document.addEventListener("DOMContentLoaded", () => {
      renderJobList();
    });

    // 1. AI求人票の生成処理
    async function generateJobOffer() {
      const title = document.getElementById("jobTitle").value.trim();
      const condition = document.getElementById("jobCondition").value.trim();
      const btn = document.getElementById("generateBtn");
      const resultContainer = document.getElementById("resultContainer");
      const resultText = document.getElementById("resultText");

      if (!title) {
        alert("職種・仕事内容を入力してください。");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Geminiに接続中...";
      resultContainer.classList.add("hidden");

      const prompt = `以下の条件をもとに、現場求職者に響く魅力的な求人票テキストを作成してください。\n【職種】${title}\n【条件・特徴】${condition}`;

      try {
        const response = await fetch("/api/ai", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "通信エラーが発生しました。");
        }

        currentGeneratedText = data.result;
        resultText.innerText = currentGeneratedText;
        resultContainer.classList.remove("hidden");

      } catch (error) {
        alert("エラーが発生しました: " + error.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Geminiで求人票を生成する";
      }
    }

    // 2. 生成した求人を掲載リスト（LocalStorage）に追加
    function publishJob() {
      const title = document.getElementById("jobTitle").value.trim() || "求人募集";
      if (!currentGeneratedText) return;

      const newJob = {
        id: Date.now(),
        title: title,
        content: currentGeneratedText,
        date: new Date().toLocaleDateString("ja-JP")
      };

      const jobs = getSavedJobs();
      jobs.unshift(newJob); // 最新を先頭に追加
      localStorage.setItem("published_jobs", JSON.stringify(jobs));

      renderJobList();

      // 入力フォームとプレビューをリセット
      document.getElementById("jobTitle").value = "";
      document.getElementById("jobCondition").value = "";
      document.getElementById("resultContainer").classList.add("hidden");
      currentGeneratedText = "";

      alert("求人一覧に掲載しました！");
    }

    // 3. 保存されている求人データを取得
    function getSavedJobs() {
      const saved = localStorage.getItem("published_jobs");
      return saved ? JSON.parse(saved) : [];
    }

    // 4. 求人カードの一覧描画
    function renderJobList() {
      const jobList = document.getElementById("jobList");
      const jobCount = document.getElementById("jobCount");
      const jobs = getSavedJobs();

      jobCount.innerText = `${jobs.length}件`;

      if (jobs.length === 0) {
        jobList.innerHTML = `
          <div class="text-center py-8 text-gray-400 text-sm">
            掲載中の求人はありません。<br>左側のフォームから作成して掲載してみましょう。
          </div>
        `;
        return;
      }

      jobList.innerHTML = jobs.map(job => `
        <div class="border rounded-lg p-4 bg-white shadow-sm hover:shadow-md transition relative border-l-4 border-l-blue-500">
          <div class="flex justify-between items-start mb-2">
            <h3 class="font-bold text-gray-800 text-base">${escapeHtml(job.title)}</h3>
            <span class="text-xs text-gray-400">${job.date}</span>
          </div>
          <p class="text-xs text-gray-600 line-clamp-3 mb-3 whitespace-pre-wrap">${escapeHtml(job.content)}</p>
          <div class="flex justify-end gap-2 border-t pt-2 mt-2">
            <button onclick="deleteJob(${job.id})" class="text-xs text-red-500 hover:text-red-700 px-2 py-1 rounded">
              削除
            </button>
          </div>
        </div>
      `).join("");
    }

    // 5. 求人の削除処理
    function deleteJob(id) {
      if (!confirm("この求人を削除してもよろしいですか？")) return;
      let jobs = getSavedJobs();
      jobs = jobs.filter(job => job.id !== id);
      localStorage.setItem("published_jobs", JSON.stringify(jobs));
      renderJobList();
    }

    // エスケープ処理（XSS対策）
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
