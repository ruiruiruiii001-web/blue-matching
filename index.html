<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求人票ジェネレーター</title>
    <!-- 必要に応じてCSS等の読み込みをここに記述してください -->
</head>
<body>
    <div class="container">
        <h1>現役エンジニア向け求人プラットフォーム</h1>
        
        <!-- 入力エリア -->
        <div class="input-section">
            <h2>条件を入力</h2>
            <textarea id="promptInput" rows="5" placeholder="ここに求人条件やプロンプトを入力してください..."></textarea>
            <button onclick="generateJobPosting()">Geminiで求人票を一発作成</button>
        </div>

        <!-- プレビューエリア -->
        <div class="preview-section">
            <h2>求人票プレビュー</h2>
            <div id="loading" style="display: none;">Geminiが求人票を構築中...</div>
            <div id="previewArea" style="white-space: pre-wrap; margin-top: 10px;"></div>
        </div>
    </div>

    <!-- JavaScript 処理部分 -->
    <script>
      async function generateJobPosting() {
        const promptInput = document.getElementById('promptInput');
        const promptText = promptInput.value.trim();

        if (!promptText) {
          alert('プロンプト（条件）を入力してください。');
          return;
        }

        const loadingElement = document.getElementById('loading');
        const previewArea = document.getElementById('previewArea');
        
        if (loadingElement) loadingElement.style.display = 'block';
        previewArea.textContent = '';

        try {
          // 新しく作成した '/api/ai' エンドポイントへリクエストを送信
          const response = await fetch('/api/ai', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ prompt: promptText }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'APIの呼び出しに失敗しました');
          }

          // Geminiからのレスポンスからテキストを取り出して表示
          const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || JSON.stringify(data, null, 2);
          previewArea.textContent = aiText;

        } catch (error) {
          alert('エラーが発生しました：\n' + error.message);
        } finally {
          if (loadingElement) loadingElement.style.display = 'none';
        }
      }
    </script>
</body>
</html>
