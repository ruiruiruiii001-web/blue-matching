<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場直結！職人＆親方の求人マッチング</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-20 font-sans">

  <!-- ヘッダー -->
  <header class="bg-blue-600 text-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide">👷 現場直結！マッチング</h1>
        <p class="text-xs text-blue-100">クラウド同期・現場特化型</p>
      </div>
      <span class="text-xs bg-blue-700 px-3 py-1.5 rounded-full font-bold">クラウド版</span>
    </div>
  </header>

  <!-- タブ切替 -->
  <div class="max-w-5xl mx-auto px-4 mt-4">
    <div class="flex border-b border-gray-300 bg-white rounded-t-lg shadow-sm">
      <button id="tabEmployerBtn" onclick="switchTab('employer')" class="flex-1 py-3.5 font-bold text-sm md:text-base border-b-2 border-blue-600 text-blue-600 focus:outline-none transition">
        🏢 親方・企業向け（求人投稿）
      </button>
      <button id="tabSeekerBtn" onclick="switchTab('seeker')" class="flex-1 py-3.5 font-bold text-sm md:text-base border-b-2 border-transparent text-gray-500 hover:text-blue-600 focus:outline-none transition">
        👷 職人・求職者向け（即戦力カード）
      </button>
    </div>
  </div>

  <main class="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <!-- 左側①：親方・企業向け 求人作成 -->
    <section id="employerSection" class="space-y-6">
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 id="jobFormHeading" class="text-lg font-bold mb-4 border-b pb-2 text-blue-600">現場求人のクラウド投稿</h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">職種・現場名 <span class="text-red-500">*</span></label>
            <input type="text" id="jobTitle" placeholder="例: 解体現場の作業員・ダンプ運転手" class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">勤務地</label>
            <input type="text" id="jobLocation" placeholder="例: 東京都新宿区 / 神奈川県横浜市" class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">募集人数</label>
              <select id="jobCapacity" class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="1">1〜3名（少人数・ピンポイント）</option>
                <option value="4" selected>4〜6名（チーム・中規模）</option>
                <option value="7">7〜10名（大規模）</option>
                <option value="11">11名以上（超大型・大量募集）</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">給与（日給・月給）</label>
              <input type="text" id="jobSalary" placeholder="例: 日給 15,000円〜" class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">連絡用電話番号 <span class="text-red-500">*</span></label>
              <input type="text" id="jobPhone" placeholder="例: 09012345678" class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">LINE ID / 公式URL (任意)</label>
              <input type="text" id="jobLine" placeholder="例: line_id_123" class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>

          <!-- 現場特化タグ選択 (12種類) -->
          <div>
            <label class="block text-sm font-medium mb-1">現場アピールタグ（複数選択可）</label>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="日払い・手渡しOK"> <span>💰 日払い・手渡し</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="現場直行直帰OK"> <span>🚗 現場直行直帰</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="マイカー・バイク通勤可"> <span>🅿️ マイカー通勤可</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="雨天時給料保証あり"> <span>☔️ 雨天給料保証</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="寮・社宅完備"> <span>🏠 寮・社宅あり</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="未経験・即日OK"> <span>⚡️ 即日・未経験OK</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="夜勤・高収入"> <span>🌙 夜勤・高収入</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="残業ほぼナシ"> <span>⏰ 残業ほぼナシ</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="道具・作業着支給"> <span>🧰 道具・作業着支給</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="資格取得支援"> <span>🎓 資格取得支援</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="週1〜OK・シフト自由"> <span>📅 週1〜・シフト自由</span></label>
              <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="jobTag" value="ミドル・シニア活躍中"> <span>👴 ミドル・シニア活躍</span></label>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">仕事内容の補足</label>
            <textarea id="jobDuties" rows="2" placeholder="例: 都内の木造解体現場。資材の運び出しと簡単な手元作業です。" class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
          </div>

          <button id="jobSubmitButton" onclick="publishJob()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition shadow text-base">
            🔥 クラウドに求人を今すぐ掲載する
          </button>
          <button id="cancelEditButton" onclick="cancelJobEdit()" class="w-full border border-gray-300 text-gray-700 font-bold py-2.5 rounded-lg hover:bg-gray-50 hidden">
            編集をキャンセル
          </button>
        </div>
      </div>
    </section>

    <!-- 左側②：職人向け 即戦力プロフィール -->
    <section id="seekerSection" class="bg-white p-6 rounded-lg shadow-md h-fit hidden">
      <h2 class="text-lg font-bold mb-4 border-b pb-2 text-blue-600">職人Webカード（一発応募用）</h2>
      
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">お名前 / 通称 <span class="text-red-500">*</span></label>
            <input type="text" id="seekerName" placeholder="例: 職人 太郎" class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">携帯電話番号</label>
            <input type="text" id="seekerPhone" placeholder="例: 090-XXXX-XXXX" class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <!-- 資格チェックボックス -->
        <div>
          <label class="block text-sm font-medium mb-1">保有資格（該当するものをチェック）</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="seekerLic" value="普通自動車免許"> <span>🚗 普通自動車免許</span></label>
            <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="seekerLic" value="中型/大型免許"> <span>🚚 中型/大型免許</span></label>
            <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="seekerLic" value="玉掛け/クレーン"> <span>🏗 玉掛け・クレーン</span></label>
            <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="seekerLic" value="足場組み立て"> <span>🪜 足場組み立て</span></label>
            <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="seekerLic" value="車両系建設機械"> <span>🚜 車両系建設機械</span></label>
            <label class="flex items-center space-x-1.5 p-2 border rounded bg-gray-50"><input type="checkbox" name="seekerLic" value="施工管理技士"> <span>📋 施工管理技士</span></label>
          </div>
        </div>

        <!-- 即戦力メーター -->
        <div class="bg-gray-50 p-3 rounded border space-y-3">
          <p class="text-xs font-bold text-gray-700">💪 即戦力アピール</p>
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block font-medium mb-1">現場経験年数</label>
              <select id="seekerExpYears" class="w-full border rounded p-2">
                <option value="未経験（やる気あり）">未経験（やる気あり）</option>
                <option value="1〜2年">1〜2年</option>
                <option value="3〜5年（即戦力）">3〜5年（即戦力）</option>
                <option value="5年以上（ベテラン）">5年以上（ベテラン）</option>
              </select>
            </div>
            <div>
              <label class="block font-medium mb-1">体力自信度</label>
              <select id="seekerStamina" class="w-full border rounded p-2">
                <option value="★★★★★ (自信あり)">★★★★★ (自信あり)</option>
                <option value="★★★☆☆ (普通)">★★★☆☆ (普通)</option>
              </select>
            </div>
          </div>
        </div>

        <button onclick="saveSeekerProfile()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow text-base">
          ✅ 職人プロフィールを保存する
        </button>
      </div>

      <div id="profileSavedMessage" class="mt-4 p-3 bg-blue-50 border border-blue-200 text-blue-800 rounded text-xs hidden">
        👍 保存完了！右側の求人カードから「ワンタップ応募」が使えます！
      </div>
    </section>

    <!-- 右側：掲載中の現場求人一覧 -->
    <section class="bg-white p-6 rounded-lg shadow-md h-fit">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-lg font-bold text-gray-800">現場求人一覧 (クラウド)</h2>
        <span id="jobCount" class="text-xs bg-gray-200 text-gray-700 px-2.5 py-1 rounded-full font-bold">0件</span>
      </div>

      <!-- 検索バー -->
      <div class="mb-4">
        <input type="text" id="searchKeyword" oninput="renderJobList()" placeholder="🔍 職種・勤務地・タグで検索 (例: 横浜, 日払い)..." class="w-full border rounded px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input type="checkbox" id="openJobsOnly" onchange="renderJobList()" class="rounded text-blue-600 focus:ring-blue-500">
          募集中のみ表示
        </label>
        <label class="text-sm text-gray-700">
          <span class="block mb-1">募集人数</span>
          <select id="capacityFilter" onchange="renderJobList()" class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">すべて</option>
            <option value="1">1〜3名（少人数・ピンポイント）</option>
            <option value="4">4〜6名（チーム・中規模）</option>
            <option value="7">7〜10名（大規模）</option>
            <option value="11">11名以上（超大型・大量募集）</option>
          </select>
        </label>
        <label class="text-sm text-gray-700 sm:col-span-2">
          <span class="block mb-1">並び替え</span>
          <select id="jobSort" onchange="renderJobList()" class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="newest">新着順</option>
            <option value="salary">給与額が高い順</option>
          </select>
        </label>
      </div>

      <div id="jobList" class="space-y-4 max-h-[600px] overflow-y-auto pr-1">
        <!-- 求人カード -->
      </div>
    </section>

  </main>

  <!-- 求人詳細 & ワンタップ直通応募モーダル -->
  <div id="jobModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-xl w-full max-h-[90vh] overflow-y-auto p-6 relative">
      
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>

      <div class="border-b pb-3 mb-4">
        <span id="modalCapacity" class="inline-block bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded font-bold mb-2"></span>
        <span id="modalClosed" class="inline-block bg-gray-200 text-gray-700 text-xs px-2.5 py-0.5 rounded font-bold mb-2 hidden">募集終了</span>
        <h2 id="modalTitle" class="text-xl font-bold text-gray-800"></h2>
        <p id="modalLocation" class="text-sm text-gray-600 mt-1"></p>
        <p id="modalSalary" class="text-base font-bold text-red-600 mt-1"></p>
      </div>

      <!-- タグ一覧 -->
      <div id="modalTags" class="flex flex-wrap gap-1.5 mb-4"></div>

      <div class="mb-6 bg-gray-50 p-3.5 rounded border text-xs leading-relaxed text-gray-700 whitespace-pre-wrap" id="modalDuties"></div>

      <!-- ワンタップ連絡アクションボタン -->
      <div class="space-y-3 border-t pt-4">
        <p class="text-xs font-bold text-center text-gray-600">＼ 面倒な履歴書不要！親方に直接連絡 ／</p>
        
        <button onclick="applyViaLINE()" id="btnLine" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 rounded-lg transition shadow text-sm flex items-center justify-center space-x-2">
          <span>💬 LINEで親方に直接メッセージ</span>
        </button>

        <button onclick="applyViaSMS()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 rounded-lg transition shadow text-sm flex items-center justify-center space-x-2">
          <span>📱 SMS (ショートメッセージ) で直接応募</span>
        </button>

        <button onclick="applyViaPhone()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow text-sm flex items-center justify-center space-x-2">
          <span>📞 親方に直接電話をかける</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    // Supabase 設定
    const SUPABASE_URL = 'https://qefqlbkqewvahtqzqmfp.supabase.co';
    // ※通常のanonキーはeyJから始まりますが、お持ちのキーをそのままセットしています
    const SUPABASE_KEY = 'sb_publishable_RljFK2XPFMXkP-_yoRQs6w_HK3F1k60'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cachedJobs = [];
    let selectedJob = null;
    let editingJobId = null;

    document.addEventListener("DOMContentLoaded", () => {
      fetchJobs();
      loadSeekerProfile();
    });

    function switchTab(tab) {
      const employerSection = document.getElementById("employerSection");
      const seekerSection = document.getElementById("seekerSection");
      const tabEmployerBtn = document.getElementById("tabEmployerBtn");
      const tabSeekerBtn = document.getElementById("tabSeekerBtn");

      if (tab === 'employer') {
        employerSection.classList.remove("hidden");
        seekerSection.classList.add("hidden");
        tabEmployerBtn.className = "flex-1 py-3.5 font-bold text-sm md:text-base border-b-2 border-blue-600 text-blue-600 focus:outline-none transition";
        tabSeekerBtn.className = "flex-1 py-3.5 font-bold text-sm md:text-base border-b-2 border-transparent text-gray-500 hover:text-blue-600 focus:outline-none transition";
      } else {
        employerSection.classList.add("hidden");
        seekerSection.classList.remove("hidden");
        tabSeekerBtn.className = "flex-1 py-3.5 font-bold text-sm md:text-base border-b-2 border-blue-600 text-blue-600 focus:outline-none transition";
        tabEmployerBtn.className = "flex-1 py-3.5 font-bold text-sm md:text-base border-b-2 border-transparent text-gray-500 hover:text-blue-600 focus:outline-none transition";
      }
    }

    // Supabaseから求人一覧を取得
    async function fetchJobs() {
      const { data, error } = await supabaseClient
        .from('published_jobs')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error("データ取得エラー:", error);
        return;
      }
      cachedJobs = data || [];
      renderJobList();
    }

    // 求人投稿・編集（Supabaseへ保存）
    async function publishJob() {
      const title = document.getElementById("jobTitle").value.trim();
      const location = document.getElementById("jobLocation").value.trim();
      const salary = document.getElementById("jobSalary").value.trim();
      const phone = document.getElementById("jobPhone").value.trim();
      const line = document.getElementById("jobLine").value.trim();
      const duties = document.getElementById("jobDuties").value.trim();
      const capacity = parseInt(document.getElementById("jobCapacity").value) || 1;

      const checkedTags = Array.from(document.querySelectorAll('input[name="jobTag"]:checked')).map(cb => cb.value);

      if (!title || !phone) {
        alert("「職種名」と「連絡用電話番号」は必須項目です。");
        return;
      }

      const jobData = {
        title, location, salary, phone, line, duties, capacity,
        tags: checkedTags
      };

      const query = supabaseClient.from('published_jobs');
      const { error } = editingJobId
        ? await query.update(jobData).eq('id', editingJobId)
        : await query.insert([jobData]);

      if (error) {
        alert(`${editingJobId ? "更新" : "投稿"}に失敗しました: ${error.message}`);
        return;
      }

      const wasEditing = editingJobId !== null;
      cancelJobEdit();

      alert(wasEditing ? "求人情報を更新しました！" : "クラウド上に求人を掲載しました！");
      await fetchJobs();
    }

    function editJob(id) {
      const job = cachedJobs.find(item => item.id === id);
      if (!job) return;

      editingJobId = id;
      document.getElementById("jobTitle").value = job.title || "";
      document.getElementById("jobLocation").value = job.location || "";
      document.getElementById("jobSalary").value = job.salary || "";
      document.getElementById("jobPhone").value = job.phone || "";
      document.getElementById("jobLine").value = job.line || "";
      document.getElementById("jobDuties").value = job.duties || "";
      document.getElementById("jobCapacity").value = getCapacityOptionValue(job.capacity);
      document.querySelectorAll('input[name="jobTag"]').forEach(cb => {
        cb.checked = Array.isArray(job.tags) && job.tags.includes(cb.value);
      });
      document.getElementById("jobFormHeading").innerText = "求人情報を編集";
      document.getElementById("jobSubmitButton").innerText = "変更を保存";
      document.getElementById("cancelEditButton").classList.remove("hidden");
      document.getElementById("employerSection").scrollIntoView({ behavior: "smooth" });
    }

    function cancelJobEdit() {
      editingJobId = null;
      document.getElementById("jobTitle").value = "";
      document.getElementById("jobLocation").value = "";
      document.getElementById("jobSalary").value = "";
      document.getElementById("jobPhone").value = "";
      document.getElementById("jobLine").value = "";
      document.getElementById("jobDuties").value = "";
      document.getElementById("jobCapacity").value = "1";
      document.querySelectorAll('input[name="jobTag"]').forEach(cb => cb.checked = false);
      document.getElementById("jobFormHeading").innerText = "現場求人のクラウド投稿";
      document.getElementById("jobSubmitButton").innerText = "🔥 クラウドに求人を今すぐ掲載する";
      document.getElementById("cancelEditButton").classList.add("hidden");
    }

    async function toggleJobClosed(id) {
      const job = cachedJobs.find(item => item.id === id);
      if (!job) return;

      const isClosed = Boolean(job.is_closed);
      const action = isClosed ? "募集を再開" : "募集を終了";
      if (!confirm(`「${job.title}」の${action}をしますか？`)) return;

      const { error } = await supabaseClient
        .from('published_jobs')
        .update({ is_closed: !isClosed })
        .eq('id', id);

      if (error) {
        alert(`${action}に失敗しました: ${error.message}`);
        return;
      }

      await fetchJobs();
      if (selectedJob && selectedJob.id === id) openModal(id);
    }

    // 求職者プロフィール保存（ローカル）
    function saveSeekerProfile() {
      const checkedLic = Array.from(document.querySelectorAll('input[name="seekerLic"]:checked')).map(cb => cb.value);
      
      const profile = {
        name: document.getElementById("seekerName").value.trim(),
        phone: document.getElementById("seekerPhone").value.trim(),
        licenses: checkedLic,
        expYears: document.getElementById("seekerExpYears").value,
        stamina: document.getElementById("seekerStamina").value
      };

      if (!profile.name) {
        alert("お名前を入力してください。");
        return;
      }

      localStorage.setItem("seeker_profile", JSON.stringify(profile));
      document.getElementById("profileSavedMessage").classList.remove("hidden");
    }

    function loadSeekerProfile() {
      const saved = localStorage.getItem("seeker_profile");
      if (!saved) return;
      const profile = JSON.parse(saved);
      document.getElementById("seekerName").value = profile.name || "";
      document.getElementById("seekerPhone").value = profile.phone || "";
      document.getElementById("seekerExpYears").value = profile.expYears || "未経験（やる気あり）";
      document.getElementById("seekerStamina").value = profile.stamina || "★★★★★ (自信あり)";

      if (profile.licenses) {
        document.querySelectorAll('input[name="seekerLic"]').forEach(cb => {
          cb.checked = profile.licenses.includes(cb.value);
        });
      }
    }

    // 求人リスト描画
    function renderJobList() {
      const jobList = document.getElementById("jobList");
      const jobCount = document.getElementById("jobCount");
      const keyword = document.getElementById("searchKeyword").value.toLowerCase();
      const openJobsOnly = document.getElementById("openJobsOnly").checked;
      const capacityFilter = document.getElementById("capacityFilter").value;
      const sortBy = document.getElementById("jobSort").value;

      const filteredJobs = cachedJobs
        .filter(job =>
          (!keyword ||
            (job.title || "").toLowerCase().includes(keyword) ||
            (job.location || "").toLowerCase().includes(keyword) ||
            (job.tags && job.tags.some(t => t.toLowerCase().includes(keyword)))) &&
          (!openJobsOnly || !job.is_closed) &&
          (!capacityFilter || getCapacityOptionValue(job.capacity) === capacityFilter)
        )
        .sort((a, b) => {
          if (sortBy === "salary") {
            const salaryDifference = getSalaryAmount(b.salary) - getSalaryAmount(a.salary);
            if (salaryDifference !== 0) return salaryDifference;
          }
          return compareJobsByNewest(a, b);
        });

      jobCount.innerText = `${filteredJobs.length}件`;

      if (filteredJobs.length === 0) {
        jobList.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">該当する現場求人はありません。</div>`;
        return;
      }

      jobList.innerHTML = filteredJobs.map(job => `
        <div onclick="openModal(${job.id})" class="border rounded-lg p-4 bg-white shadow-sm hover:shadow-md transition cursor-pointer relative border-l-4 ${job.is_closed || job.capacity <= 0 ? 'border-l-gray-400 opacity-75' : 'border-l-blue-500'}">
          <div class="flex justify-between items-start mb-1">
            <h3 class="font-bold text-gray-800 text-base">${escapeHtml(job.title)}</h3>
            <span class="text-xs text-gray-400">ID: ${job.id}</span>
          </div>
          <div class="flex flex-wrap gap-1 mb-2">
            ${job.is_closed ? '<span class="bg-gray-200 text-gray-700 text-[10px] px-1.5 py-0.5 rounded font-bold">募集終了</span>' : ''}
            <span class="bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded font-bold">募集人数: ${formatJobCapacity(job.capacity)}</span>
          </div>
          ${job.location ? `<p class="text-sm text-gray-600 mb-2">📍 ${escapeHtml(job.location)}</p>` : ''}
          <p class="text-sm font-bold text-red-600 mb-2">${escapeHtml(job.salary || '給与応相談')}</p>
          
          <!-- タグ表示 -->
          <div class="flex flex-wrap gap-1 mb-3">
            ${job.tags ? job.tags.map(t => `<span class="bg-blue-50 text-blue-700 border border-blue-200 text-[10px] px-1.5 py-0.5 rounded font-medium">${escapeHtml(t)}</span>`).join("") : ''}
          </div>

          <div class="flex justify-between items-center border-t pt-2 mt-2">
            <span class="text-xs text-blue-600 font-bold hover:underline">📱 ワンタップ連絡・詳細 →</span>
            <div class="flex gap-2">
              <button onclick="event.stopPropagation(); editJob(${job.id})" class="text-xs text-blue-600 px-2 py-1">編集</button>
              <button onclick="event.stopPropagation(); toggleJobClosed(${job.id})" class="text-xs text-gray-600 px-2 py-1">${job.is_closed ? '募集再開' : '募集終了'}</button>
              <button onclick="event.stopPropagation(); deleteJob(${job.id})" class="text-xs text-red-500 px-2 py-1">削除</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    // モーダル表示
    function openModal(id) {
      selectedJob = cachedJobs.find(j => j.id === id);
      if (!selectedJob) return;

      document.getElementById("modalTitle").innerText = selectedJob.title;
      document.getElementById("modalLocation").innerText = selectedJob.location ? `📍 ${selectedJob.location}` : "";
      document.getElementById("modalSalary").innerText = selectedJob.salary || "給与応相談";
      document.getElementById("modalCapacity").innerText = `募集人数: ${formatJobCapacity(selectedJob.capacity)}`;
      document.getElementById("modalDuties").innerText = selectedJob.duties || "特記事項なし";
      document.getElementById("modalClosed").classList.toggle("hidden", !selectedJob.is_closed);

      const btnLine = document.getElementById("btnLine");
      if (selectedJob.line && !selectedJob.is_closed) {
        btnLine.classList.remove("hidden");
      } else {
        btnLine.classList.add("hidden");
      }
      document.querySelectorAll("#jobModal button[onclick^='applyVia']:not(#btnLine)").forEach(button => {
        button.classList.toggle("hidden", Boolean(selectedJob.is_closed));
      });

      const tagsContainer = document.getElementById("modalTags");
      tagsContainer.innerHTML = selectedJob.tags ? selectedJob.tags.map(t => `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-bold">${escapeHtml(t)}</span>`).join("") : '';

      document.getElementById("jobModal").classList.remove("hidden");
    }

    // LINE応募
    function applyViaLINE() {
      if (!selectedJob || !selectedJob.line) return;
      let lineUrl = selectedJob.line;
      if (!lineUrl.startsWith("http")) {
        lineUrl = `https://line.me/R/ti/p/~${selectedJob.line}`;
      }
      window.open(lineUrl, '_blank');
    }

    // SMS応募
    function applyViaSMS() {
      if (!selectedJob || !selectedJob.phone) return;

      const saved = localStorage.getItem("seeker_profile");
      let message = "";

      if (saved) {
        const p = JSON.parse(saved);
        message = `【求人応募】${selectedJob.title}の募集を見て連絡しました。氏名:${p.name} / 経験:${p.expYears} / 資格:${p.licenses ? p.licenses.join(',') : 'なし'}。よろしくお願いします。`;
      } else {
        message = `【求人応募】${selectedJob.title}の募集を見て連絡しました。詳細をお伺いできますでしょうか？`;
      }

      window.location.href = `sms:${selectedJob.phone}?body=${encodeURIComponent(message)}`;
    }

    // 直接電話
    function applyViaPhone() {
      if (!selectedJob || !selectedJob.phone) return;
      window.location.href = `tel:${selectedJob.phone}`;
    }

    function closeModal() {
      document.getElementById("jobModal").classList.add("hidden");
      selectedJob = null;
    }

    function formatJobCapacity(capacity) {
      const count = Number.parseInt(capacity, 10);
      if (!Number.isFinite(count) || count < 1) return "1〜3名（少人数・ピンポイント）";
      if (count <= 3) return "1〜3名（少人数・ピンポイント）";
      if (count <= 6) return "4〜6名（チーム・中規模）";
      if (count <= 10) return "7〜10名（大規模）";
      return "11名以上（超大型・大量募集）";
    }

    function getCapacityOptionValue(capacity) {
      const count = Number.parseInt(capacity, 10);
      if (!Number.isFinite(count) || count <= 3) return "1";
      if (count <= 6) return "4";
      if (count <= 10) return "7";
      return "11";
    }

    function getSalaryAmount(salary) {
      const normalizedSalary = String(salary || "").replace(/,/g, "");
      const match = normalizedSalary.match(/(\d+(?:\.\d+)?)\s*(万|千)?/);
      if (!match) return -1;

      const multiplier = match[2] === "万" ? 10000 : match[2] === "千" ? 1000 : 1;
      return Number(match[1]) * multiplier;
    }

    function compareJobsByNewest(a, b) {
      const aDate = Date.parse(a.created_at || "");
      const bDate = Date.parse(b.created_at || "");
      if (Number.isFinite(aDate) && Number.isFinite(bDate) && aDate !== bDate) {
        return bDate - aDate;
      }

      const aId = Number(a.id);
      const bId = Number(b.id);
      if (Number.isFinite(aId) && Number.isFinite(bId)) return bId - aId;
      return String(b.id).localeCompare(String(a.id));
    }

    // Supabaseから求人を削除
    async function deleteJob(id) {
      if (!confirm("この求人をクラウドから削除しますか？")) return;
      
      const { error } = await supabaseClient
        .from('published_jobs')
        .delete()
        .eq('id', id);

      if (error) {
        alert("削除に失敗しました: " + error.message);
        return;
      }

      fetchJobs();
      closeModal();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
