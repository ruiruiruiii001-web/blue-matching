<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場特化型 求人・採用マッチングプラットフォーム</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- ヘッダー -->
  <header class="bg-blue-600 text-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">現場特化型 求人＆マッチング</h1>
      <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">テンプレート穴埋め式</span>
    </div>
  </header>

  <!-- タブ切替ナビゲーション -->
  <div class="max-w-5xl mx-auto px-4 mt-6">
    <div class="flex border-b border-gray-300">
      <button id="tabEmployerBtn" onclick="switchTab('employer')" class="py-2 px-6 font-bold text-sm border-b-2 border-blue-600 text-blue-600 focus:outline-none">
        🏢 企業向け（求人作成）
      </button>
      <button id="tabSeekerBtn" onclick="switchTab('seeker')" class="py-2 px-6 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-blue-600 focus:outline-none">
        👷 求職者向け（Web履歴書）
      </button>
    </div>
  </div>

  <main class="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <!-- 左側①：企業向け 求人作成フォーム -->
    <section id="employerSection" class="bg-white p-6 rounded-lg shadow-md h-fit">
      <h2 class="text-lg font-bold mb-4 border-b pb-2 text-blue-600">求人票テンプレート入力</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">職種名</label>
          <input type="text" id="jobTitle" placeholder="例: 建築現場の施工管理スタッフ" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">募集人数</label>
            <input type="number" id="jobCapacity" placeholder="例: 3" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm" min="1" value="1">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">勤務地・エリア</label>
            <input type="text" id="jobLocation" placeholder="例: 東京都内および近郊" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">給与条件（月給・日給など）</label>
          <input type="text" id="jobSalary" placeholder="例: 月給 300,000円 〜 450,000円" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">主な仕事内容</label>
          <textarea id="jobDuties" rows="2" placeholder="例: 現場での資材管理、安全確認、簡単な軽作業など。" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">アピールポイント・待遇</label>
          <input type="text" id="jobPerks" placeholder="例: 未経験歓迎 / 資格取得支援あり / 寮完備" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>

        <button onclick="previewTemplate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded transition shadow text-sm">
          求人票をプレビューする
        </button>
      </div>

      <!-- プレビュー結果エリア -->
      <div id="resultContainer" class="mt-6 hidden">
        <h3 class="text-md font-semibold mb-2 text-gray-700">完成プレビュー</h3>
        <div id="resultText" class="p-4 bg-gray-50 border rounded text-xs whitespace-pre-wrap leading-relaxed min-h-[140px] text-gray-700 font-mono"></div>
        
        <button onclick="publishJob()" class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded transition shadow text-sm">
          📌 この求人を一覧に掲載する
        </button>
      </div>
    </section>

    <!-- 左側②：求職者向け Web履歴書・プロフィールフォーム -->
    <section id="seekerSection" class="bg-white p-6 rounded-lg shadow-md h-fit hidden">
      <h2 class="text-lg font-bold mb-4 border-b pb-2 text-green-600">求職者プロフィール（簡易Web履歴書）</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">お名前・ニックネーム</label>
          <input type="text" id="seekerName" placeholder="例: 現場 太郎" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-green-500 outline-none text-sm">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">年齢</label>
            <input type="number" id="seekerAge" placeholder="例: 25" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-green-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">連絡先（電話 / Email）</label>
            <input type="text" id="seekerContact" placeholder="例: 090-XXXX-XXXX" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-green-500 outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">保有資格（該当するものを入力）</label>
          <input type="text" id="seekerLicenses" placeholder="例: 普通自動車免許、玉掛け、中型免許" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-green-500 outline-none text-sm">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">これまでの現場経験・得意な業務</label>
          <textarea id="seekerExp" rows="2" placeholder="例: 解体現場経験2年、内装クロス貼り、建築資材の搬入作業など。" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-green-500 outline-none text-sm"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">希望条件（働き方・日払いなど）</label>
          <input type="text" id="seekerPreference" placeholder="例: 即日勤務OK / 週4日希望 / 日払い希望" class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-green-500 outline-none text-sm">
        </div>

        <button onclick="saveSeekerProfile()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded transition shadow text-sm">
          プロフィール情報を保存する
        </button>
      </div>

      <div id="profileSavedMessage" class="mt-4 p-3 bg-green-50 border border-green-200 text-green-800 rounded text-xs hidden">
        ✅ プロフィールが保存されました！右側の求人一覧からそのまま「応募する」ボタンで応募できます。
      </div>
    </section>

    <!-- 右側：掲載中の求人カード一覧 & 検索 -->
    <section class="bg-white p-6 rounded-lg shadow-md">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-lg font-bold text-gray-800">掲載中の求人一覧</h2>
        <span id="jobCount" class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded-full">0件</span>
      </div>

      <!-- キーワード検索バー -->
      <div class="mb-4">
        <input type="text" id="searchKeyword" oninput="renderJobList()" placeholder="🔍 職種名やキーワードで検索..." class="w-full border rounded px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div id="jobList" class="space-y-4 max-h-[550px] overflow-y-auto pr-1">
        <!-- カードが動的に追加されます -->
      </div>
    </section>

  </main>

  <!-- 求人詳細 & 応募用モーダル -->
  <div id="jobModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative">
      
      <!-- 閉じるボタン -->
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>

      <!-- モーダルヘッダー -->
      <div class="border-b pb-3 mb-4">
        <div class="flex justify-between items-center mb-2">
          <span id="modalCapacityBadge" class="inline-block bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded font-semibold"></span>
          <!-- 採用人数調整ボタン -->
          <div class="space-x-1">
            <button onclick="adjustCapacity(-1)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-2 py-1 rounded">人数 -1</button>
            <button onclick="adjustCapacity(1)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-2 py-1 rounded">人数 +1</button>
          </div>
        </div>
        <h2 id="modalTitle" class="text-xl font-bold text-gray-800"></h2>
        <p id="modalDate" class="text-xs text-gray-400 mt-1"></p>
      </div>

      <!-- 求人本文 -->
      <div class="mb-6">
        <h3 class="text-sm font-bold text-gray-700 mb-2">【求人詳細】</h3>
        <div id="modalContent" class="p-4 bg-gray-50 border rounded text-xs whitespace-pre-wrap leading-relaxed text-gray-700 font-mono"></div>
      </div>

      <!-- 応募ボタンセクション -->
      <div class="border-t pt-4">
        <button id="applyBtn" onclick="applyJob()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded transition shadow text-sm">
          📩 保存したWeb履歴書でこの求人に応募する
        </button>
      </div>

    </div>
  </div>

  <script>
    let currentGeneratedText = "";
    let selectedJob = null;

    document.addEventListener("DOMContentLoaded", () => {
      renderJobList();
      loadSeekerProfile();
    });

    // タブ切替機能
    function switchTab(tab) {
      const employerSection = document.getElementById("employerSection");
      const seekerSection = document.getElementById("seekerSection");
      const tabEmployerBtn = document.getElementById("tabEmployerBtn");
      const tabSeekerBtn = document.getElementById("tabSeekerBtn");

      if (tab === 'employer') {
        employerSection.classList.remove("hidden");
        seekerSection.classList.add("hidden");
        tabEmployerBtn.className = "py-2 px-6 font-bold text-sm border-b-2 border-blue-600 text-blue-600 focus:outline-none";
        tabSeekerBtn.className = "py-2 px-6 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-blue-600 focus:outline-none";
      } else {
        employerSection.classList.add("hidden");
        seekerSection.classList.remove("hidden");
        tabSeekerBtn.className = "py-2 px-6 font-bold text-sm border-b-2 border-green-600 text-green-600 focus:outline-none";
        tabEmployerBtn.className = "py-2 px-6 font-bold text-sm border-b-2 border-transparent text-gray-500 hover:text-green-600 focus:outline-none";
      }
    }

    // テンプレートから求人票テキストを組み立てる
    function previewTemplate() {
      const title = document.getElementById("jobTitle").value.trim();
      const capacity = document.getElementById("jobCapacity").value.trim() || "1";
      const location = document.getElementById("jobLocation").value.trim() || "指定なし";
      const salary = document.getElementById("jobSalary").value.trim() || "要相談";
      const duties = document.getElementById("jobDuties").value.trim() || "特になし";
      const perks = document.getElementById("jobPerks").value.trim() || "特になし";

      if (!title) {
        alert("職種名を入力してください。");
        return;
      }

      currentGeneratedText = `【職種】
${title}

【仕事内容】
${duties}

【給与条件】
${salary}

【勤務地】
${location}

【アピールポイント・待遇】
${perks}

----------------------------------------
ご応募お待ちしております！`;

      document.getElementById("resultText").innerText = currentGeneratedText;
      document.getElementById("resultContainer").classList.remove("hidden");
    }

    // 求人を掲載（LocalStorageに保存）
    function publishJob() {
      const title = document.getElementById("jobTitle").value.trim() || "求人募集";
      const capacity = parseInt(document.getElementById("jobCapacity").value) || 1;
      if (!currentGeneratedText) return;

      const newJob = {
        id: Date.now(),
        title: title,
        capacity: capacity,
        content: currentGeneratedText,
        date: new Date().toLocaleDateString("ja-JP")
      };

      const jobs = getSavedJobs();
      jobs.unshift(newJob);
      localStorage.setItem("published_jobs", JSON.stringify(jobs));

      renderJobList();

      document.getElementById("jobTitle").value = "";
      document.getElementById("jobCapacity").value = "1";
      document.getElementById("jobLocation").value = "";
      document.getElementById("jobSalary").value = "";
      document.getElementById("jobDuties").value = "";
      document.getElementById("jobPerks").value = "";
      document.getElementById("resultContainer").classList.add("hidden");
      currentGeneratedText = "";

      alert("求人を一覧に掲載しました！");
    }

    function getSavedJobs() {
      const saved = localStorage.getItem("published_jobs");
      return saved ? JSON.parse(saved) : [];
    }

    // 求職者プロフィールの保存＆取得
    function saveSeekerProfile() {
      const profile = {
        name: document.getElementById("seekerName").value.trim(),
        age: document.getElementById("seekerAge").value.trim(),
        contact: document.getElementById("seekerContact").value.trim(),
        licenses: document.getElementById("seekerLicenses").value.trim(),
        exp: document.getElementById("seekerExp").value.trim(),
        preference: document.getElementById("seekerPreference").value.trim()
      };

      if (!profile.name) {
        alert("お名前を入力してください。");
        return;
      }

      localStorage.setItem("seeker_profile", JSON.stringify(profile));
      document.getElementById("profileSavedMessage").classList.remove("hidden");
    }

    function loadSeekerProfile() {
      const saved = localStorage.getItem("seeker_profile");
      if (!saved) return;
      const profile = JSON.parse(saved);
      document.getElementById("seekerName").value = profile.name || "";
      document.getElementById("seekerAge").value = profile.age || "";
      document.getElementById("seekerContact").value = profile.contact || "";
      document.getElementById("seekerLicenses").value = profile.licenses || "";
      document.getElementById("seekerExp").value = profile.exp || "";
      document.getElementById("seekerPreference").value = profile.preference || "";
    }

    // 応募処理
    function applyJob() {
      const saved = localStorage.getItem("seeker_profile");
      if (!saved) {
        alert("応募するには、まず「求職者向け（Web履歴書）」タブからプロフィールを登録・保存してください。");
        switchTab('seeker');
        closeModal();
        return;
      }

      const profile = JSON.parse(saved);
      alert(`【応募完了】\n${selectedJob.title} へ応募しました！\n\n【応募者情報】\n氏名: ${profile.name}\n連絡先: ${profile.contact}`);
      closeModal();
    }

    // 求人カード一覧の表示
    function renderJobList() {
      const jobList = document.getElementById("jobList");
      const jobCount = document.getElementById("jobCount");
      const keyword = document.getElementById("searchKeyword").value.toLowerCase();
      const jobs = getSavedJobs();

      const filteredJobs = jobs.filter(job => 
        job.title.toLowerCase().includes(keyword) || job.content.toLowerCase().includes(keyword)
      );

      jobCount.innerText = `${filteredJobs.length}件`;

      if (filteredJobs.length === 0) {
        jobList.innerHTML = `
          <div class="text-center py-8 text-gray-400 text-sm">
            該当する求人はありません。
          </div>
        `;
        return;
      }

      jobList.innerHTML = filteredJobs.map(job => `
        <div onclick="openModal(${job.id})" class="border rounded-lg p-4 bg-white shadow-sm hover:shadow-md transition cursor-pointer relative border-l-4 ${job.capacity > 0 ? 'border-l-blue-500' : 'border-l-gray-400 opacity-75'}">
          <div class="flex justify-between items-start mb-1">
            <h3 class="font-bold text-gray-800 text-base">${escapeHtml(job.title)}</h3>
            <span class="text-xs text-gray-400">${job.date}</span>
          </div>
          <span class="inline-block ${job.capacity > 0 ? 'bg-blue-50 text-blue-700' : 'bg-gray-200 text-gray-700'} text-xs px-2 py-0.5 rounded font-medium mb-2">
            ${job.capacity > 0 ? `残り募集人数: ${job.capacity}名` : '採用終了（満員）'}
          </span>
          <p class="text-xs text-gray-600 line-clamp-2 mb-3 whitespace-pre-wrap">${escapeHtml(job.content)}</p>
          <div class="flex justify-between items-center border-t pt-2 mt-2">
            <span class="text-xs text-blue-600 font-semibold hover:underline">詳細・応募を見る →</span>
            <button onclick="event.stopPropagation(); deleteJob(${job.id})" class="text-xs text-red-500 hover:text-red-700 px-2 py-1 rounded">
              削除
            </button>
          </div>
        </div>
      `).join("");
    }

    // モーダル表示制御 & 人数調整
    function openModal(id) {
      const jobs = getSavedJobs();
      selectedJob = jobs.find(j => j.id === id);
      if (!selectedJob) return;

      updateModalUI();
      document.getElementById("jobModal").classList.remove("hidden");
    }

    function updateModalUI() {
      if (!selectedJob) return;
      document.getElementById("modalTitle").innerText = selectedJob.title;
      document.getElementById("modalCapacityBadge").innerText = `残り募集人数: ${selectedJob.capacity} 名`;
      document.getElementById("modalDate").innerText = `掲載日: ${selectedJob.date}`;
      document.getElementById("modalContent").innerText = selectedJob.content;
    }

    function adjustCapacity(amount) {
      if (!selectedJob) return;
      selectedJob.capacity = Math.max(0, selectedJob.capacity + amount);
      
      let jobs = getSavedJobs();
      jobs = jobs.map(j => j.id === selectedJob.id ? selectedJob : j);
      localStorage.setItem("published_jobs", JSON.stringify(jobs));

      updateModalUI();
      renderJobList();
    }

    function closeModal() {
      document.getElementById("jobModal").classList.add("hidden");
      selectedJob = null;
    }

    function deleteJob(id) {
      if (!confirm("この求人を削除してもよろしいですか？")) return;
      let jobs = getSavedJobs();
      jobs = jobs.filter(job => job.id !== id);
      localStorage.setItem("published_jobs", JSON.stringify(jobs));
      renderJobList();
      closeModal();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
