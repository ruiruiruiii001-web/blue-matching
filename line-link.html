<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>LINE通知の連携 | 地域のお助け仕事掲示板</title>
  <link rel="stylesheet" href="styles/tailwind.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase-client.js"></script>
  <script src="scripts/line-link.js" defer></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-800">
  <header class="bg-blue-600 px-4 py-4 text-white">
    <div class="mx-auto max-w-xl">
      <a href="index.html" class="font-bold">地域のお助け仕事掲示板</a>
    </div>
  </header>
  <main class="mx-auto max-w-xl px-4 py-8">
    <section class="rounded-xl bg-white p-5 shadow-sm">
      <h1 class="text-xl font-bold">LINE応募通知の連携</h1>
      <p class="mt-3 text-sm leading-6">連携すると、募集への新しい応募をLINEでお知らせします。応募者名・応募内容・連絡先はLINEに送られません。連携はマイページからいつでも解除できます。</p>
      <p id="lineLinkStatus" role="status" aria-live="polite" class="mt-4 text-sm text-gray-700">ログイン状態を確認しています。</p>
      <button id="lineLinkSubmit" type="button" class="mt-4 hidden min-h-11 rounded-lg bg-blue-600 px-4 py-2 font-bold text-white hover:bg-blue-700">このアカウントとLINEを連携する</button>
      <a id="lineLinkLogin" href="index.html" class="mt-4 hidden min-h-11 items-center rounded-lg border border-blue-600 px-4 py-2 font-bold text-blue-700">サイトでログインする</a>
      <a href="index.html" class="mt-4 block text-sm text-blue-700 underline">サイトに戻る</a>
    </section>
  </main>
</body>
</html>
